# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "(cd invokeai/frontend/webv2 && corepack enable && pnpm install --frozen-lockfile)"
  start: "cd invokeai/frontend/webv2 && pnpm dev:mock --port {port} --strictPort --host 0.0.0.0"
  url: http://localhost:{port}
  readyPath: /
  runtime: node22
  env:
    NODE_ENV: development
demo:
  maxVideos: 1
  beforePass: true
